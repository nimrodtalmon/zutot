name: Deploy site
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"   # weekly (Mon): refresh CV citation stats
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refresh CV citation stats from Google Scholar
        run: python3 cv/update_stats.py
      - name: Commit refreshed stats
        run: |
          if ! git diff --quiet cv/index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "CV: refresh citation stats"
            git pull --rebase origin main && git push || echo "push skipped"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
