<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ערכת DBT קטנה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fdfbf7; --fg:#2a2a33; --muted:#7a7883; --line:#ebe6dd; --card:#fff;
          --m0:#b98a45; --m1:#3a9a83; --m2:#df7558; --m3:#8a6cc9; --m4:#3f8fd0; --c:var(--m0); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17171b; --fg:#ecebf0; --muted:#a3a1ab; --line:#2d2c33; --card:#1f1f25;
            --m0:#e0b06a; --m1:#62c7ad; --m2:#f2967c; --m3:#b49af0; --m4:#74b4ec; }
  }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--fg); background:var(--bg); font:16px/1.6 Rubik, system-ui, Arial, sans-serif; }
  body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background: radial-gradient(900px 520px at 100% -10%, color-mix(in srgb, var(--c) 15%, transparent), transparent 70%),
                radial-gradient(700px 520px at -10% 110%, color-mix(in srgb, var(--m1) 8%, transparent), transparent 70%); }
  button, select { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--c); outline-offset:2px; border-radius:6px; }
  [dir="ltr"] { unicode-bidi:isolate; }
  .title { font-size:21px; margin:0; font-weight:600; line-height:1.3; }
  .dots { display:inline-flex; gap:4px; margin-inline-start:8px; vertical-align:middle; }
  .dots i { width:8px; height:8px; border-radius:50%; display:block; }

  .app { max-width:1120px; margin:0 auto; padding:20px 22px; display:grid; grid-template-columns:220px 1fr; gap:28px; }

  /* side: title, contents, controls */
  aside { display:flex; flex-direction:column; min-height:0; }
  .toc { flex:0 1 auto; min-height:0; overflow-y:auto; margin-top:10px; }
  .grp + .grp { margin-top:7px; }
  .grp h3 { margin:0 0 1px; font-size:12px; font-weight:600; color:var(--g); display:flex; align-items:center; gap:7px; }
  .grp h3::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--g); }
  .grp a { display:flex; justify-content:space-between; align-items:center; gap:6px; padding:1px 12px 1px 8px; margin-inline-start:3px;
           border-inline-start:2px solid var(--line); color:var(--fg); text-decoration:none; font-size:14px; line-height:1.36; }
  .grp a:hover { background:color-mix(in srgb, var(--g) 7%, transparent); }
  .grp a.on { border-inline-start-color:var(--g); background:color-mix(in srgb, var(--g) 13%, transparent);
              color:color-mix(in srgb, var(--g) 78%, var(--fg)); font-weight:500; }
  .grp a .ok { color:var(--g); font-size:12px; }
  .ctl { margin-top:10px; padding-top:10px; border-top:1px solid var(--line); font-size:14px; }
  .ctl .row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .ctl .row + .row { margin-top:8px; }
  .ctl label { display:flex; gap:7px; align-items:center; cursor:pointer; }
  .ctl input { accent-color:var(--c); width:17px; height:17px; margin:0; }
  .ctl .muted { color:var(--muted); font-size:13px; }
  .arrows { display:flex; gap:6px; }
  .arrows button { width:32px; height:28px; border:1px solid var(--line); background:var(--card); border-radius:999px; cursor:pointer; color:var(--muted); line-height:1; }
  .arrows button:hover:not(:disabled) { border-color:var(--c); color:var(--c); }
  .arrows button:disabled { opacity:.35; cursor:default; }
  .link { background:none; border:0; padding:0; cursor:pointer; color:var(--muted); font-size:13px; text-decoration:underline; text-underline-offset:3px; }

  /* card */
  .main { min-height:0; display:flex; }
  .card { width:100%; align-self:flex-start; background:var(--card); border:1px solid color-mix(in srgb, var(--c) 20%, var(--line)); border-radius:18px;
          padding:18px 26px 18px; box-shadow:0 8px 28px color-mix(in srgb, var(--c) 11%, transparent); position:relative; overflow:hidden; line-height:1.55; }
  .card::before { content:""; position:absolute; inset:0 0 auto 0; height:6px;
                  background:linear-gradient(90deg, color-mix(in srgb, var(--c) 40%, var(--card)), var(--c)); }
  #one .card { animation:fade .18s ease-out; }
  @keyframes fade { from { opacity:0; transform:translateY(3px); } to { opacity:1; transform:none; } }
  .mod { font-size:13px; font-weight:500; color:var(--c); }
  .card h2 { margin:1px 0 0; font-size:24px; font-weight:600; line-height:1.3; }
  .en { color:var(--muted); font-size:14px; }
  .what { margin:10px 0 4px; font-size:16px; }
  .when { margin:0; color:var(--muted); font-size:15px; }
  .when b, .lbl { color:color-mix(in srgb, var(--c) 80%, var(--fg)); font-weight:500; }
  .lbl { font-size:14px; margin:14px 0 4px; }
  ol { margin:0; padding-inline-start:22px; } li { margin:3px 0; } li::marker { color:var(--c); font-weight:600; }
  table { border-collapse:separate; border-spacing:0 2px; width:100%; font-size:15px; }
  td, th { padding:4px 10px; text-align:start; vertical-align:top; }
  tbody tr:nth-child(odd) td { background:color-mix(in srgb, var(--c) 5%, var(--card)); }
  td:first-child { border-radius:0 10px 10px 0; } td:last-child { border-radius:10px 0 0 10px; }
  th { font-weight:500; color:var(--muted); font-size:13px; padding-bottom:0; }
  td.k { width:1%; white-space:nowrap; }
  td.k b { display:inline-block; min-width:30px; text-align:center; padding:0 8px; border-radius:8px; font-weight:600;
           background:color-mix(in srgb, var(--r, var(--c)) 17%, var(--card)); color:color-mix(in srgb, var(--r, var(--c)) 80%, var(--fg)); }
  td.e { color:var(--muted); width:1%; white-space:nowrap; font-size:13px; padding-top:6px; }
  .practice { background:color-mix(in srgb, var(--c) 10%, var(--card)); border-radius:14px; padding:10px 15px; margin-top:16px; }
  .practice b { color:color-mix(in srgb, var(--c) 80%, var(--fg)); font-weight:500; }
  .note { font-size:13px; color:var(--muted); margin-top:10px; }
  .chain { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:10px 0 0; font-size:14px; }
  .chain span { border-radius:999px; padding:3px 12px; }
  .chain em { display:inline-flex; gap:6px; align-items:center; font-style:normal; }
  .chain i { color:var(--muted); font-style:normal; }
  .grid4 { display:grid; grid-template-columns:auto 1fr 1fr; gap:6px; font-size:14px; max-width:470px; margin-top:10px; }
  .grid4 div { border-radius:10px; padding:6px 10px; min-height:44px; }
  .grid4 .g { background:color-mix(in srgb, var(--m1) 14%, var(--card)); }
  .grid4 .r { background:color-mix(in srgb, var(--m2) 14%, var(--card)); }
  .grid4 .h { color:var(--muted); font-weight:500; min-height:0; }
  .venn { width:280px; height:auto; margin-top:6px; }
  svg text { font-family:Rubik, system-ui, Arial, sans-serif; }
  #all, .mob { display:none; }

  /* desktop: the window holds everything, no page scroll */
  @media (min-width:821px) {
    html, body { height:100%; overflow:hidden; }
    .app { height:100vh; }
    .main > #one { display:flex; min-height:0; width:100%; }
    #one .card { max-height:100%; overflow-y:auto; }
  }
  @media (min-width:821px) and (max-height:700px) {
    .app { padding-top:14px; padding-bottom:14px; }
    .grp a { font-size:13.5px; line-height:1.27; }
    .grp + .grp { margin-top:5px; }
  }
  /* phone: title, picker and controls on top, card below */
  @media (max-width:820px) {
    .app { grid-template-columns:1fr; gap:12px; padding:18px 14px; }
    aside .toc, aside > .title { display:none; }
    .mob { display:block; }
    .mob select { width:100%; margin-top:12px; padding:9px 12px; border-radius:12px; border:1px solid color-mix(in srgb, var(--c) 35%, var(--line));
                  background:var(--card); font-size:16px; }
    .ctl { margin-top:0; padding-top:0; border-top:0; }
    .card { padding:16px 18px; }
    td.e { display:none; }
  }
  @media print {
    html, body { height:auto !important; overflow:visible !important; }
    body::before, aside, .mob, #one { display:none !important; }
    .app { display:block; height:auto; }
    #all { display:block; }
    #all .card { break-inside:avoid; margin-bottom:14px; box-shadow:none; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="mob"><h1 class="title">ערכת DBT קטנה<span class="dots" id="dots1"></span></h1><select id="pick" aria-label="בחירת מיומנות"></select></div>
    <h1 class="title">ערכת DBT קטנה<span class="dots" id="dots2"></span></h1>
    <nav class="toc" id="toc" aria-label="מיומנויות"></nav>
    <div class="ctl">
      <div class="row"><label id="chkl"><input type="checkbox" id="chk"> תרגלנו <span class="muted" id="count"></span></label><div class="arrows"><button id="prev" aria-label="הקודם">→</button><button id="next" aria-label="הבא">←</button></div></div>
    </div>
  </aside>
  <div class="main"><div id="one"></div><div id="all"></div></div>
</div>
<script>
const MODS = [
  {id:"m0", he:"מבוא"},
  {id:"m1", he:"קשיבות"},
  {id:"m2", he:"עמידות במצוקה"},
  {id:"m3", he:"ויסות רגשי"},
  {id:"m4", he:"יעילות בין־אישית"},
];
const L = s => `<span dir="ltr">${s}</span>`;
const isLat = s => /[A-Za-z]/.test(s);

const VENN = `<svg class="venn" viewBox="0 0 360 170" width="320" role="img" aria-label="תודעה נבונה היא החפיפה בין תודעה רגשית לתודעה רציונלית">
  <circle cx="135" cy="85" r="75" fill="var(--m4)" fill-opacity=".16" stroke="var(--m4)"/>
  <circle cx="225" cy="85" r="75" fill="var(--m2)" fill-opacity=".16" stroke="var(--m2)"/>
  <text x="252" y="90" text-anchor="middle" font-size="19" fill="var(--fg)">רגשית</text>
  <text x="108" y="90" text-anchor="middle" font-size="19" fill="var(--fg)">רציונלית</text>
  <text x="180" y="90" text-anchor="middle" font-size="19" font-weight="600" fill="var(--m3)">נבונה</text>
</svg>`;
const CHAIN = (() => {
  const items = [["אירוע","m4"],["פירוש","m3"],["תחושה בגוף","m2"],["דחף","m2"],["מה עשיתי","m1"],["שם לרגש","m0"]];
  const sp = ([t,c]) => `<span style="background:color-mix(in srgb, var(--${c}) 17%, var(--card))">${t}</span>`;
  return `<div class="chain">${sp(items[0])}${items.slice(1).map(x => `<em><i>←</i>${sp(x)}</em>`).join("")}</div>`;
})();
const GRID = `<div class="grid4"><div class="h"></div><div class="h">יתרונות</div><div class="h">חסרונות</div>
  <div class="h">לפעול לפי הדחף</div><div class="g"></div><div class="r"></div>
  <div class="h">לא לפעול לפיו</div><div class="g"></div><div class="r"></div></div>`;

const S = [
 {id:"intro", m:"m0", he:"מה זה DBT‏?", en:"Dialectical Behavior Therapy",
  what:"שיטה שפיתחה הפסיכולוגית מרשה לינהן. השם בא מ\"דיאלקטיקה\": שני דברים שנראים הפוכים יכולים להיות נכונים יחד. ב־DBT אלה קבלה ושינוי. מקבלים את עצמנו כמו שאנחנו, ובאותו זמן לומדים לפעול אחרת.",
  lbl:"ארבע קבוצות מיומנויות",
  rows:[["קשיבות","Mindfulness","לשים לב למה שקורה עכשיו, בלי לשפוט. הבסיס לכל השאר.","m1"],
        ["עמידות במצוקה","Distress tolerance","לעבור רגע קשה בלי להחמיר אותו.","m2"],
        ["ויסות רגשי","Emotion regulation","להבין רגשות ולהשפיע עליהם.","m3"],
        ["יעילות בין־אישית","Interpersonal effectiveness","לבקש, לסרב ולשמור על קשרים.","m4"]],
  src:"מבוסס על מיומנויות ה־DBT של מרשה לינהן, בניסוח חופשי. חומר ללימוד ולתרגול, לא טיפול. להעמקה: לינהאן, <i>מדריך להקניית כישורים</i> (אח, 2006) · מונשיין, <i>טיפול דיאלקטי התנהגותי</i>, כרך ב' (אח, 2016).",
  practice:"כל אחת כותבת שלושה משפטים מהשבוע עם \"אבל\" (\"אני רוצה לצאת, אבל אני עייפה\") ומחליפה אותם ל\"וגם\". מה משתנה בתחושה?"},
 {id:"teach", m:"m0", he:"איך ללמד עם הערכה", en:"",
  what:"כל שיעור מתמקד במיומנות אחת. כדאי להתחיל בקשיבות, כי כל השאר נשען עליה.",
  lbl:"מבנה של שיעור",
  how:["לפתוח בשאלה: איפה השתמשת במיומנות מהפעם הקודמת, ואיפה שכחת?",
       "להסביר את המיומנות החדשה בקצרה, במילים שלך.",
       "לתת דוגמה אמיתית מהחיים שלך.",
       "לעשות ביחד את התרגיל שבסוף הכרטיס.",
       "לבחור משימה קטנה לתרגול עד הפעם הבאה, ולסמן \"תרגלנו\"."],
  plbl:"טיפ:", practice:"עדיף שיעור קצר שנגמר כשעוד יש חשק, משיעור ארוך."},

 {id:"wise", m:"m1", he:"תודעה נבונה", en:"Wise Mind",
  what:"ב־DBT מדברים על שלושה מצבי תודעה. ברגשית, הרגש מחליט. ברציונלית, רק ההיגיון והעובדות קובעים. התודעה הנבונה היא המקום שבו שתיהן נפגשות: יודעים מה מרגישים, וגם מה נכון לעשות.",
  when:"לפני החלטה, ובכל פעם שמרגישים שרק צד אחד מדבר.",
  extra:VENN,
  how:["לעצור ולנשום כמה נשימות איטיות.",
       "לשאול: \"מה התודעה הנבונה שלי אומרת?\"",
       "להקשיב לתשובה בלי להתווכח איתה. תשובה נבונה בדרך כלל מרגישה שקטה ובטוחה, לא דחופה."],
  practice:"כל אחת נזכרת בהחלטה שקיבלה מתודעה רגשית ובהחלטה שקיבלה מתודעה רציונלית. ביחד: איך הייתה נראית כל אחת מהן מתודעה נבונה?"},
 {id:"what", m:"m1", he:"מיומנויות ה\"מה\"", en:"What skills",
  what:"שלושה דברים שעושים כשמתרגלים קשיבות. בכל רגע עושים רק אחד מהם.",
  when:"בתרגול קשיבות, וגם סתם באמצע היום.",
  rows:[["להתבונן","Observe","לשים לב למה שקורה בחוץ ובפנים (מחשבות, רגשות, תחושות), בלי לנסות לשנות."],
        ["לתאר","Describe","לשים במילים את מה שרואים ומרגישים. רק עובדות, בלי פרשנות."],
        ["להשתתף","Participate","להיכנס לגמרי לפעילות, עד שנבלעים בה, בלי להסתכל על עצמנו מהצד."]],
  practice:"מתבוננות דקה בחפץ פשוט (תפוז, כוס). אחר כך כל אחת מתארת אותו בחמישה משפטים של עובדות בלבד. מי שמשתמשת במילה שיפוטית (\"יפה\", \"מוזר\") מתחילה מחדש."},
 {id:"how", m:"m1", he:"מיומנויות ה\"איך\"", en:"How skills",
  what:"שלוש דרכים לעשות את מיומנויות ה\"מה\".",
  when:"תמיד, יחד עם מיומנויות ה\"מה\".",
  rows:[["בלי שיפוטיות","Non-judgmentally","לתאר מה קרה ומה מרגישים, בלי \"טוב\", \"רע\" ו\"צריך\"."],
        ["דבר אחד בכל פעם","One-mindfully","כשאוכלים, רק אוכלים. כשמדברים, רק מדברים. כשהמחשבה בורחת, מחזירים אותה בעדינות."],
        ["ביעילות","Effectively","לעשות את מה שעובד במצב הזה, גם אם זה לא מה ש\"צודק\"."]],
  practice:"כל אחת מביאה שלושה משפטים שיפוטיים מהשבוע, ומנסחות ביחד כל אחד מחדש כתיאור. למשל: \"הוא מעצבן\" ← \"הוא דיבר בקול רם, והרגשתי כעס\"."},

 {id:"stop", m:"m2", he:"STOP", en:"עצירה לפני תגובה",
  what:"ארבעה צעדים שעוצרים תגובה אוטומטית ונותנים לתודעה הנבונה הזדמנות.",
  when:"כשהרגש חזק והדחף הוא להגיב מיד: לצעוק, לשלוח הודעה, לטרוק דלת.",
  rows:[["S","Stop","לעצור. לא לזוז ולא להגיב, אפילו לא במבט."],
        ["T","Take a step back","לקחת צעד אחורה, גם פיזית, ולנשום. ההחלטה יכולה לחכות."],
        ["O","Observe","להתבונן: מה קורה סביבי ובתוכי? מה אחרים אומרים ועושים בפועל?"],
        ["P","Proceed mindfully","להמשיך בקשיבות: מה אני רוצה שיקרה, ואיזו תגובה תקרב אותי לזה?"]],
  practice:"משחק תפקידים: אחת אומרת משפט מרגיז שסיכמתן עליו מראש. השנייה עוברת בקול על ארבעת הצעדים, ורק אז מגיבה."},
 {id:"tipp", m:"m2", he:"TIPP", en:"להוריד עוצמה דרך הגוף",
  what:"כשהרגש חזק מדי, קשה להשתמש במיומנויות אחרות. TIPP משנה משהו בגוף ומוריד את העוצמה תוך דקות.",
  when:"ברגע של הצפה, כשהעוצמה גבוהה מאוד.",
  rows:[["T","Temperature","טמפרטורה: לשטוף את הפנים במים קרים ולעצור את הנשימה לכמה שניות."],
        ["I","Intense exercise","מאמץ קצר וחזק: ריצה במקום, קפיצות או מדרגות, כמה דקות."],
        ["P","Paced breathing","נשימה איטית: נשיפה ארוכה מהשאיפה. למשל, לשאוף 4 שניות ולנשוף 6."],
        ["P","Paired muscle relaxation","הרפיית שרירים: לכווץ קבוצת שרירים בשאיפה, ולהרפות בנשיפה."]],
  note:"מים קרים מאטים את הדופק. אם יש בעיה בלב או בעיה רפואית אחרת, לשאול רופא לפני.",
  practice:"דקה של נשימה איטית ביחד. כל אחת מדרגת את הלחץ מ־0 עד 10, לפני ואחרי."},
 {id:"accepts", m:"m2", he:"ACCEPTS", en:"הסחת דעת מכוונת",

const KEY = "dbt-kit-done";
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} };
const modName = id => MODS.find(m => m.id === id).he;
const DOTS = ["m1","m2","m3","m4"].map(m => `<i style="background:var(--${m})"></i>`).join("");
document.getElementById("dots1").innerHTML = DOTS; document.getElementById("dots2").innerHTML = DOTS;

function cardHTML(s) {
  let h = `<div class="mod">${modName(s.m)}</div><h2>${s.he}</h2>`;
  if (s.en) h += `<div class="en">${isLat(s.en) ? L(s.en) : s.en}</div>`;
  h += `<p class="what">${s.what}</p>`;
  if (s.when) h += `<p class="when"><b>מתי:</b> ${s.when}</p>`;
  if (s.extra) h += s.extra;
  if (s.rows) h += `<div class="lbl">${s.lbl || "איך"}</div><table><tbody>${s.rows.map(r =>
      `<tr${r[3] ? ` style="--r:var(--${r[3]})"` : ""}><td class="k"><b>${isLat(r[0]) ? L(r[0]) : r[0]}</b></td><td class="e">${L(r[1])}</td><td>${r[2]}</td></tr>`).join("")}</tbody></table>`;
  if (s.table) h += `<div class="lbl">איך</div><table><thead><tr>${s.table.head.map(x => `<th>${x}</th>`).join("")}</tr></thead><tbody>${s.table.rows.map(r =>
      `<tr><td class="k"><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</tbody></table>`;
  if (s.how) h += `<div class="lbl">${s.rows ? "איך" : (s.lbl || "איך")}</div><ol>${s.how.map(x => `<li>${x}</li>`).join("")}</ol>`;
  if (s.note) h += `<div class="note">${s.note}</div>`;
  h += `<div class="practice"><b>${s.plbl || "לתרגל ביחד:"}</b> ${s.practice}</div>`;
  if (s.src) h += `<div class="note">${s.src}</div>`;
  return `<article class="card" style="--c:var(--${s.m})">${h}</article>`;
}

let cur = S[0];
const real = S.filter(s => s.m !== "m0");
function render(cardToo = true) {
  document.body.style.setProperty("--c", `var(--${cur.m})`);
  document.getElementById("toc").innerHTML = MODS.map(m => `<div class="grp" style="--g:var(--${m.id})"><h3>${m.he}</h3>${
      S.filter(s => s.m === m.id).map(s => `<a href="#${s.id}" class="${s === cur ? "on" : ""}" data-s="${s.id}"><span>${s.he}</span>${done[s.id] ? '<span class="ok">✓</span>' : ""}</a>`).join("")
    }</div>`).join("");
  document.getElementById("pick").innerHTML = MODS.map(m => `<optgroup label="${m.he}">${
      S.filter(s => s.m === m.id).map(s => `<option value="${s.id}" ${s === cur ? "selected" : ""}>${s.he}${done[s.id] ? " ✓" : ""}</option>`).join("")
    }</optgroup>`).join("");
  const chk = document.getElementById("chk");
  chk.checked = !!done[cur.id];
  document.getElementById("chkl").style.visibility = cur.m === "m0" ? "hidden" : "visible";
  document.getElementById("count").textContent = `(${real.filter(s => done[s.id]).length}/${real.length})`;
  const i = S.indexOf(cur);
  document.getElementById("prev").disabled = i === 0;
  document.getElementById("next").disabled = i === S.length - 1;
  if (cardToo) document.getElementById("one").innerHTML = cardHTML(cur);
}
function go(id) {
  const s = S.find(x => x.id === id); if (!s || s === cur && document.getElementById("one").innerHTML) return;
  cur = s; history.replaceState(null, "", "#" + id); render();
  if (window.matchMedia("(max-width:820px)").matches) window.scrollTo(0, 0);
}
document.getElementById("toc").onclick = e => { const a = e.target.closest("a[data-s]"); if (a) { e.preventDefault(); go(a.dataset.s); } };
document.getElementById("pick").onchange = e => go(e.target.value);
document.getElementById("chk").onchange = e => { done[cur.id] = e.target.checked; save(); render(false); };
document.getElementById("prev").onclick = () => go(S[S.indexOf(cur) - 1].id);
document.getElementById("next").onclick = () => go(S[S.indexOf(cur) + 1].id);
document.addEventListener("keydown", e => {
  if (e.target.closest("input, select, textarea")) return;
  const i = S.indexOf(cur);
  if (e.key === "ArrowLeft" && i < S.length - 1) go(S[i + 1].id);
  if (e.key === "ArrowRight" && i > 0) go(S[i - 1].id);
});
document.getElementById("all").innerHTML = S.map(cardHTML).join("");
const h0 = location.hash.slice(1);
if (S.some(s => s.id === h0)) cur = S.find(s => s.id === h0);
render();
